<!--
  FILL ME IN: replace every {{TOKEN}} (and keep the markup around it) then save
  the result to ~/.hermes/scripts/madison-events/spool/newsletter.html.
  {{DATE_RANGE}}  e.g. "Mon Sep 7 – Wed Sep 9"
  {{COUNT_LINE}}  e.g. "6 events within 25 miles of home"
  {{CARDS}}       one <div class="card">…</div> per event, chronological.
                  Card shape (repeat for each event):
                  <div class="card"><div class="cardhead"><span class="emoji">🎵</span>
                  <span class="title">TITLE (⭐ prefix if band-watch)</span></div>
                  <div class="meta">Day · 7:30 pm · Venue</div>
                  <div class="where">City · ~X mi · Free / $20</div>
                  <div class="link"><a href="URL">Details</a></div></div>
  {{NOTE}}        optional trailing note line, else empty string.
  If there are NO events: {{COUNT_LINE}} = "A quiet stretch — nothing new within 25 miles…"
  and {{CARDS}} = a single card with a 🌤 emoji and that message (file must stay >500 chars).
-->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body style="margin:0;padding:0;background:#0d1117;color:#e6edf3;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
<div style="max-width:640px;margin:0 auto;padding:32px 20px;">
  <div style="border-bottom:2px solid #30363d;padding-bottom:16px;margin-bottom:24px;">
    <div style="font-size:26px;font-weight:700;color:#e6edf3;letter-spacing:0.5px;">📍 Madison Events Newsletter</div>
    <div style="font-size:15px;color:#7d8590;margin-top:6px;">{{DATE_RANGE}} · {{COUNT_LINE}}</div>
  </div>
  {{CARDS}}
  <div style="border-top:2px solid #30363d;margin-top:28px;padding-top:14px;font-size:12px;color:#7d8590;">
    {{NOTE}}
    <div>Radius: 25 mi of your home · Titles with ⭐ = The Dawg Bones or The Jimmies.</div>
    <div style="margin-top:6px;">🤖 Generated by a Hermes AI agent on ZenithCore — reply to the Telegram bot to adjust cadence, radius, sources, or format.</div>
  </div>
</div>
<style>.card{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:14px 16px;margin-bottom:14px;}
.cardhead{font-size:16px;font-weight:600;color:#e6edf3;}
.emoji{margin-right:8px;}
.meta{font-size:14px;color:#a5b3c2;margin-top:6px;}
.where{font-size:13px;color:#7d8590;margin-top:2px;}
.link{margin-top:8px;}
.link a{color:#58a6ff;text-decoration:none;font-size:13px;}</style>
</body></html>
